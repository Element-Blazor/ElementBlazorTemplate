<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Element-Blazor, Element的Blazor版本，用 .NET 写前端的 UI 框架，开箱即用，配套了WebAssembly 版本，PWA模式</title>
    <base href="/" />
    <link href="manifest.json" rel="manifest" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="stylesheet" href="/_content/Element/css/fix.css" />
    <link rel="stylesheet" href="/_content/Element/css/index.css" />
    <link rel="stylesheet" href="/_content/Element/css/theme.css" />
    <link rel="stylesheet" href="/_content/Element.X/css/x.css" />
    <link href="/_content/Element.Markdown/css/editormd.min.css" rel="stylesheet" />
    <link href="/_content/Element.Markdown/css/editor.css" rel="stylesheet" />
    <link href="https://cdn.bootcss.com/codemirror/5.48.4/addon/fold/foldgutter.min.css" rel="stylesheet">
    <link href="https://cdn.bootcss.com/codemirror/5.48.4/codemirror.min.css" rel="stylesheet">
    <style>
        html {
            display: flex;
            height: 100%;
            width: 100%;
        }

        body {
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            background-color: #ffffff;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            font-weight: 400;
            font-size: 100%;
            margin: 0em;
            display: flex;
            flex: 1;
            padding: 0em;
        }

            body > app {
                align-items: center;
                justify-content: center;
                flex: 1;
                display: flex;
            }

        .boot-loading {
            display: grid;
            gap: 14px;
            justify-items: center;
            color: #1f2d3d;
            font-size: 16px;
            font-weight: 700;
        }

        .boot-loading img {
            width: 96px;
            height: 96px;
        }
    </style>

</head>

<body>
    <app>
        <div class="boot-loading" role="status" aria-live="polite">
            <img src="logo-loading.svg" alt="" />
            <span>Element-Blazor</span>
        </div>
    </app>

    <script src="/_content/Element/js/dom.js"></script>
    <script src="https://cdn.bootcss.com/codemirror/5.48.4/codemirror.min.js"></script>
    <script src="/_content/Element.Markdown/js/addons.min.js"></script>
    <script src="/_content/Element.Markdown/js/continuelist.js"></script>
    <script src="/_content/Element.Markdown/js/modes.min.js"></script>
    <script src="/_content/Element.Markdown/js/dom.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
